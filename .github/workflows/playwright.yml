# Имя workflow — так он отображается во вкладке Actions.
name: Playwright CI

# События, которые запускают проверки.
on:
  # Проверяем каждое изменение до слияния через Pull Request.
  pull_request:
    # `main` здесь — целевая ветка PR, а не имя рабочей ветки.
    branches: [main]
  # Оставляем кнопку ручного запуска во вкладке Actions.
  workflow_dispatch:

# Проверки разложены по уровням пирамиды тестов: статический анализ и каждый
# проект Playwright — отдельная работа. Работы не связаны `needs` и стартуют
# параллельно: падение линтера не прячет результат e2e, а общий wall-clock
# равен самой медленной работе, а не сумме всех шагов.
jobs:
  # Технический идентификатор работы (виден в URL); name — читаемое имя в UI.
  lint:
    name: Статический анализ (ESLint + tsc)
    runs-on: ubuntu-latest
    # Быстрые проверки не должны висеть полчаса, если что-то пошло не так.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Статический анализ без запуска тестов: ESLint ищет проблемы стиля
      # и типовые ошибки в коде тестов, tsc --noEmit — ошибки типов.
      - name: Lint tests
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Unit-уровень: чистые функции из src/pyramid, браузер не нужен —
  # поэтому Chromium в этой работе не ставим.
  unit:
    name: Unit-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true

  # API-уровень: мок-сервер поднимается прямо в тестовом процессе (beforeAll),
  # внешний браузер не нужен.
  api:
    name: API-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api
        env:
          CI: true

  # E2E-уровень: реальный Chromium на живом стенде aiqa.su — единственная
  # работа, где нужны браузерные бинарники и HTML-отчёт для разбора падений.
  e2e:
    name: E2E-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # Playwright-пакет и браузерный бинарник устанавливаются отдельно.
      - name: Install Chromium and system dependencies
        # Для учебного CI достаточно Chromium; `--with-deps` добавляет нужные библиотеки Linux.
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Включает CI-режим в playwright.config.ts: retry, один worker и reporter без открытия окна.
          CI: true

      # Сохраняем HTML-отчёт после завершения тестов.
      - name: Upload Playwright report
        # Загружаем отчёт и после успеха, и после падения; пропускаем только отменённый run.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Уникальный run_id не даёт отчётам разных запусков конфликтовать по имени.
          name: playwright-report-${{ github.run_id }}
          # Стандартный каталог, куда HTML reporter Playwright пишет отчёт.
          path: playwright-report/
          # Двух недель достаточно для разбора PR, старые учебные отчёты не храним бессрочно.
          retention-days: 14

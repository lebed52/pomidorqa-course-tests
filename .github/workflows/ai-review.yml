name: AI Review

on:
  workflow_run:
    workflows: [Playwright CI]
    types: [completed]

jobs:
  review:
    name: Review changed tests
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # workflow_run имеет доступ к секретам, поэтому код PR здесь запускать нельзя.
      # Берём доверенную версию reviewer из main, а diff читаем через GitHub API.
      - name: Checkout trusted reviewer from main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Review Pull Request diff
        run: node scripts/ai-review.mjs
        env:
          POLZA_AI_API_KEY: ${{ secrets.POLZA_AI_API_KEY }}
          POLZA_AI_MODEL: qwen/qwen3.8-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AI_REVIEW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          AI_REVIEW_FROM_GITHUB: true

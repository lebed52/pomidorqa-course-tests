name: Playwright CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POMIDORQA_BASE_URL: https://aiqa.su

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check code
        run: npm run lint

      - name: Unit + API tests
        run: npx playwright test --project=unit --project=api

      - name: E2E tests
        run: npx playwright test --project=e2e --retries=1

      - name: Save report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
